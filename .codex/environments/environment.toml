version = 1
name = "dev"

[setup]
script = '''
set -eu

# Share Ben's live state across checkouts; .worktreeinclude copies .env.
ben_local="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
mkdir -p "$ben_local/logs"
if [ ! -e logs ] && [ ! -L logs ]; then
  ln -s "$ben_local/logs" logs
fi

pnpm install --frozen-lockfile'''

[[actions]]
name = "Test"
icon = "tool"
command = "pnpm test"

[[actions]]
name = "Run"
icon = "tool"
command = "pnpm dev"
